<!doctype html>
<html><head><meta charset="utf-8"><title>Fairycake Falls – cake sheet</title>
<link rel="stylesheet" href="../css/font.css">
<style>
  body { margin: 0; background: #f6e4f0; font-family: Fredoka, sans-serif; color: #5a2f4e; }
  h2 { margin: 14px 12px 4px; font-size: 18px; }
  h2 small { font-size: 12px; font-weight: 600; color: #a0567f; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 8px; }
  .k { text-align: center; font-size: 11px; line-height: 1.1; }
  .k canvas { display: block; margin: 0 auto 2px; background: rgba(255,255,255,0.55); border-radius: 14px; }
  .k b { display: block; font-size: 11.5px; }
  .pond { margin: 0 10px 10px; border-radius: 18px; display: block; }
</style></head>
<body>
<script src="../js/core.js"></script>
<script src="../js/cakes.js"></script>
<script>
/* Every cake of the collection on one page – a contact sheet to check the art.
   One row per world (tier order), the rare finds and the Magic Cake; under each world a strip of "pond"
   with the same cakes at the size they have on a phone (and the rare finds swimming with them), because
   that is where two cakes must never look alike.
   ?size=150 draws bigger icons, ?expr=happy shows another face, ?pond=0 hides the pond strips. */
(function () {
  const C = FC.Cakes;
  const q = new URLSearchParams(location.search);
  const expr = q.get('expr') || 'normal';
  const size = +(q.get('size') || 104);
  const showPond = q.get('pond') !== '0';
  const groups = [];
  for (let w = 0; w < C.WORLD_COUNT; w++) groups.push({ name: 'World ' + (w + 1), ids: C.WORLD_MENUS[w].slice(1), pond: true });
  groups.push({ name: 'Rare finds + Magic', ids: C.RARES.concat(['magic']) });
  // tiers 1–11 of a world floating in a strip of water, at a phone's scale (pond radius 1000 ≈ 173 px, two device px per px)
  function pond(ids, title) {
    const scale = 0.173, W = 960, H = 120;
    const cv = document.createElement('canvas');
    cv.width = W * 2; cv.height = H * 2;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.className = 'pond';
    const x = cv.getContext('2d');
    x.scale(2, 2);
    const g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#7fd8e6'); g.addColorStop(1, '#3fa6cf');
    x.fillStyle = g;
    x.fillRect(0, 0, W, H);
    let px = 18;
    const all = ids.concat(C.RARES, ['magic']);
    for (const id of all) {
      const r = C.TIERS[C.tierOf(id)].r * scale;
      const cx = px + r * 1.1, cy = H * 0.62;
      const sp = C.renderSprite(id, r * 2);
      x.save();
      x.translate(cx, cy - r * 0.45);
      x.scale(0.5, 0.5);
      x.drawImage(sp.canvas, -sp.cx, -sp.cy);
      x.scale(r * 2, r * 2);
      C.drawFace(x, id, { expr, blink: 0, lookX: 0, lookY: 0.3 });
      x.restore();
      px += r * 2.25 + 3;
      if (id === ids[ids.length - 1]) px += 16;
    }
    x.fillStyle = 'rgba(255,255,255,0.85)';
    x.font = '600 10px Fredoka, sans-serif';
    x.fillText(title + ' – as in the pond on a phone (with the rare finds and the Magic Cake)', 10, 13);
    return cv;
  }
  for (const g of groups) {
    const h = document.createElement('h2');
    h.textContent = g.name;
    document.body.appendChild(h);
    const row = document.createElement('div');
    row.className = 'row';
    for (const id of g.ids) {
      const s = C.spec(id);
      const d = document.createElement('div');
      d.className = 'k';
      d.style.width = size + 4 + 'px';
      const cv = document.createElement('canvas');
      cv.style.width = cv.style.height = size + 'px';
      d.appendChild(cv);
      C.drawIcon(cv, id, { w: size, h: size, expr });
      const b = document.createElement('b');
      b.textContent = s.name;
      d.appendChild(b);
      d.appendChild(document.createTextNode('T' + s.tier + ' · ' + (C.SIZE_NAMES[s.tier] || s.style)));
      row.appendChild(d);
    }
    document.body.appendChild(row);
    if (g.pond && showPond) document.body.appendChild(pond(g.ids, g.name));
  }
  window.SHEET_DONE = true;
})();
</script>
</body></html>
