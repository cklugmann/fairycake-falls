<!doctype html>
<html><head><meta charset="utf-8"><title>Fairycake Falls – cake sheet</title>
<link rel="stylesheet" href="../css/font.css">
<style>
  body { margin: 0; background: #f6e4f0; font-family: Fredoka, sans-serif; color: #5a2f4e; }
  h2 { margin: 14px 12px 4px; font-size: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 8px; }
  .k { width: 108px; text-align: center; font-size: 11px; line-height: 1.1; }
  .k canvas { width: 104px; height: 104px; display: block; margin: 0 auto 2px; background: rgba(255,255,255,0.55); border-radius: 14px; }
  .k b { display: block; font-size: 11.5px; }
</style></head>
<body>
<script src="../js/core.js"></script>
<script src="../js/cakes.js"></script>
<script>
/* Renders every collectible cake (per world, in tier order) – a contact sheet to check the art. */
(function () {
  const C = FC.Cakes;
  const groups = [];
  for (let w = 0; w < C.WORLD_COUNT; w++) groups.push({ name: 'World ' + (w + 1), ids: C.WORLD_MENUS[w].slice(1) });
  groups.push({ name: 'Rare finds + Magic', ids: C.RARES.concat(['magic']) });
  const expr = new URLSearchParams(location.search).get('expr') || 'normal';
  for (const g of groups) {
    const h = document.createElement('h2');
    h.textContent = g.name;
    document.body.appendChild(h);
    const row = document.createElement('div');
    row.className = 'row';
    for (const id of g.ids) {
      const s = C.spec(id);
      const d = document.createElement('div');
      d.className = 'k';
      const cv = document.createElement('canvas');
      d.appendChild(cv);
      C.drawIcon(cv, id, { w: 104, h: 104, expr });
      const b = document.createElement('b');
      b.textContent = s.name;
      d.appendChild(b);
      d.appendChild(document.createTextNode('T' + s.tier + ' · ' + s.style));
      row.appendChild(d);
    }
    document.body.appendChild(row);
  }
  window.SHEET_DONE = true;
})();
</script>
</body></html>
